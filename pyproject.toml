[project]
name = "pahang-cli"
version = "1.14.1"
description = "Pahang Area - Interactive CLI for PE inspection workflows"


requires-python = ">=3.11"
dependencies = [
    "questionary>=2.1.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
    "PyPDF2>=3.0.0",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "python-docx>=0.8.11",
    "docxtpl>=0.16.0",
    "docxcompose>=1.4.0",
    "pywin32>=305",
]

[project.scripts]
pahang-cli = "src.workflow_cli:run_cli"

[tool.setuptools]
packages = ["src"]
py-modules = ["config"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["scratch"]
